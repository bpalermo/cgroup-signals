name: publish

# main publishes the multi-arch images ghcr.io/bpalermo/cgroup-signals and
# ghcr.io/bpalermo/cgroup-signals-bpftrace under the mutable `dev` tag and the
# immutable `dev-<commit>` tag. Nothing else publishes: no release is created
# here. Each Helm chart follows its image, as
# oci://ghcr.io/bpalermo/charts/<cgroup-signals|bpftrace-debug> at the version
# bazel/workspace_status.sh stamps (0.1.0-dev.<commit time>.g<short commit>),
# pinning the image this same run pushed by digest. A chart version is never
# moved.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Keyed by branch, not by commit, so publications are serialized: the `dev` tag
# is mutable, and two runs publishing at once could leave it on the older
# commit. A commit queued behind another is cancelled and publishes nothing,
# which is visible; a stale `dev` is not.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    # The `release` environment admits only main (its deployment branch policy), so a
    # workflow edited on another branch cannot run this job with packages: write.
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # workspace_status.sh runs `git describe --tags`.
          fetch-depth: 0
          persist-credentials: false

      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: publish
          repository-cache: true
          cache-save: false

      - name: bazel test //...
        run: bazel test --config=ci //...

      # image_push (rules_img) reads the Docker config this writes. The
      # registry host is bazel/registry.bzl's IMAGE_REGISTRY.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the multi-arch images
        run: |
          set -euo pipefail
          bazel run --config=ci //cgroup-signals:image_push
          bazel run --config=ci //bpftrace:image_push

      # The digests come from the build, not from resolving a mutable tag after
      # the push. They are what the charts pin, so each chart is checked
      # against its image's, and against the registry, before anything is pushed.
      - name: Record the pushed image digests
        id: image
        run: |
          set -euo pipefail
          # record <output-name> <bazel package> <image repository>
          record() {
            # With a warm disk cache Bazel does not write a cached output it was
            # not asked for, and the push never asks for the digest file.
            bazel build --config=ci "//$2:image_index"
            index_file="$(bazel cquery --config=ci "//$2:image_index" --output=files 2>/dev/null \
              | grep -E '_index\.json$' | head -1)"
            digest_file="${index_file%_index.json}_digest"
            if [ -z "${index_file}" ] || [ ! -s "${digest_file}" ]; then
              echo "::error::could not find the image index digest produced by the build of $2" >&2
              exit 1
            fi
            digest="$(cat "${digest_file}")"
            case "${digest}" in
              sha256:*) ;;
              *) echo "::error::unexpected digest ${digest}" >&2; exit 1 ;;
            esac
            # The registry agrees: the commit's tag resolves to that digest.
            pushed="$(docker buildx imagetools inspect \
              "ghcr.io/bpalermo/$3:dev-${GITHUB_SHA}" --format '{{.Manifest.Digest}}')"
            if [ "${pushed}" != "${digest}" ]; then
              echo "::error::$3 dev-${GITHUB_SHA} is ${pushed} in the registry, the build produced ${digest}" >&2
              exit 1
            fi
            echo "$1=${digest}" >>"${GITHUB_OUTPUT}"
            echo "image: \`ghcr.io/bpalermo/$3@${digest}\`" >>"${GITHUB_STEP_SUMMARY}"
          }
          record cgroup_signals cgroup-signals cgroup-signals
          record bpftrace bpftrace cgroup-signals-bpftrace

      # The charts, after the images they pin. Packaged first and verified: the
      # version must be this commit's and the pinned digest the one just
      # pushed, because a pushed version is never moved.
      - name: Package and verify the charts
        id: chart
        env:
          CGROUP_SIGNALS_DIGEST: ${{ steps.image.outputs.cgroup_signals }}
          BPFTRACE_DIGEST: ${{ steps.image.outputs.bpftrace }}
        run: |
          set -euo pipefail
          version="$(awk '$1 == "STABLE_CHART_VERSION" { print $2 }' bazel-out/stable-status.txt)"
          [ -n "${version}" ] || { echo "::error::no STABLE_CHART_VERSION in the stable status" >&2; exit 1; }
          # verify <chart> <digest>
          verify() {
            bazel build --config=ci "//chart/$1:$1"
            chart="$(bazel cquery --config=ci "//chart/$1:$1" --output=files 2>/dev/null | grep -E '\.tgz$' | head -1)"
            bazel/verify-chart.sh "$1" "${chart}" "$2" "${version}" "${GITHUB_SHA}"
          }
          verify cgroup-signals "${CGROUP_SIGNALS_DIGEST}"
          verify bpftrace-debug "${BPFTRACE_DIGEST}"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"

      # GHCR, with the login above: helm falls back to Docker's credentials.
      # The target is registry_url + the chart's name.
      - name: Push the charts
        env:
          VERSION: ${{ steps.chart.outputs.version }}
        run: |
          set -euo pipefail
          for chart in cgroup-signals bpftrace-debug; do
            bazel run --config=ci "//chart/${chart}:${chart}.push_registry"
            ref="oci://ghcr.io/bpalermo/charts/${chart} --version ${VERSION}"
            echo "pushed chart ${ref}"
            echo "chart: \`${ref}\`" >>"${GITHUB_STEP_SUMMARY}"
          done

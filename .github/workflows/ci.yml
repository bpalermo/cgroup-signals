name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to commit SHAs, not tags; the version each SHA
# corresponds to is in the comment beside it. Dependabot keeps them current.
#
# Caches: every job RESTORES the Bazel caches, but only runs on main SAVE them
# (cache-save below), so only reviewed code populates a cache that a later
# trusted build consumes. Gated on the ref rather than the event, because
# workflow_dispatch can target any branch.
#
# Target determination: `diff` computes, with bazel-diff, the targets this
# change impacts (bazel/ci-impacted-targets.sh) and hands `build` the lists to
# build and test from; `build` is skipped when nothing is impacted. The checks that cover
# the whole tree cheaply (the formatter, Gazelle) run every time, in `lint`.
# Anything bazel-diff cannot decide (no base, an error) is a full run.
jobs:
  # The whole-tree checks that cost no build of consequence: the formatter and
  # the BUILD files' freshness. Unconditional, so a change bazel-diff scopes
  # down to nothing is still formatted and generated right.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No version is pinned here: bazelisk reads .bazelversion, so the
      # checkout is the single source of the Bazel version.
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-lint
          repository-cache: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      # Starlark (with buildifier's lint warnings), Go and shell. The loop is
      # there because a language whose formatter did not run reports nothing,
      # which looks the same as clean.
      - name: Everything is formatted
        run: |
          out="$(bazel run --config=ci //:format.check 2>&1)" || { echo "${out}"; echo "::error::run 'bazel run //:format'" >&2; exit 1; }
          echo "${out}"
          for language in Starlark Go Shell; do
            if ! grep -q "^Formatted ${language} " <<<"${out}"; then
              echo "::error::the formatter did not run for ${language}" >&2
              exit 1
            fi
          done

      # Gazelle generates the BUILD files, so a hand-edited or stale one is a
      # real failure mode: the build keeps working against the old graph until
      # someone regenerates and the diff appears in an unrelated PR.
      - name: BUILD files are up to date
        run: |
          bazel run --config=ci //:gazelle
          if ! git diff --exit-code -- 'BUILD.bazel' '**/BUILD.bazel'; then
            echo "::error::BUILD files are stale; run 'bazel run //:gazelle'" >&2
            exit 1
          fi

      # Everything publish.yml builds is built by `build` whenever it is
      # impacted; naming it here keeps a rename or a removal from passing CI
      # and failing on the first publish. A query, not a build: it fails on a
      # label that does not exist and costs nothing else. Keep this equal to
      # what publish.yml pushes.
      - name: the publish targets exist
        run: bazel query --config=ci --noshow_progress 'set(//cgroup-signals:image_push //cgroup-signals:image_index //bpftrace:image_push //bpftrace:image_index //chart/cgroup-signals:cgroup-signals //chart/cgroup-signals:cgroup-signals.push_registry //chart/bpftrace-debug:bpftrace-debug //chart/bpftrace-debug:bpftrace-debug.push_registry //bazel:verify-chart.sh)'

  # Target determination. bazel-diff hashes the build graph at the base and at
  # the head of the range under test and reports the targets whose hash
  # changed; bazel/ci-impacted-targets.sh splits them into what to build and what
  # to test, and uploads the lists for `build`.
  # On any error, or without a base (workflow_dispatch), it falls back to a
  # full run; it never reports an empty set on a failure.
  #
  # The range: on pull_request the checkout is the merge of the pull request
  # into its base, so the base is the merge's first parent and the head the
  # merge itself, the tree every job builds. On push to main the parent of the
  # squash-merged commit is what main was before it. workflow_dispatch has no
  # base, and runs everything.
  diff:
    name: diff
    runs-on: ubuntu-latest
    outputs:
      has_any: ${{ steps.impacted.outputs.has_any }}
      has_test: ${{ steps.impacted.outputs.has_test }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The whole history: the base has to be reachable for the diff.
          fetch-depth: 0
          persist-credentials: false

      - name: the range under test
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          base=""
          case "${EVENT}" in
            pull_request)
              if [ "$(git rev-parse HEAD^2 2>/dev/null)" = "${PR_HEAD}" ]; then
                base="$(git rev-parse HEAD^1)"
              else
                echo "::warning::the checkout is not the merge of ${PR_HEAD}; no base, running everything" >&2
              fi
              ;;
            push)
              base="$(git rev-parse HEAD^1 2>/dev/null)" || base=""
              ;;
          esac
          echo "base=${base}" >>"${GITHUB_OUTPUT}"
          echo "head=$(git rev-parse HEAD)" >>"${GITHUB_OUTPUT}"
          echo "range: ${base:-<none: full run>} .. $(git rev-parse HEAD)"

      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      # bazel-diff, the statically linked binary of its GitHub release, pinned
      # by version and checksum (the digest GitHub records for the asset).
      # Releases after v47.0.0 ship no bazel-diff_deploy.jar any more, so no
      # Java is needed.
      - name: bazel-diff
        env:
          VERSION: v60.0.0
          SHA256: 4c1e70c955a7a950fc0ce15d921e976078a5fd1571e423c05016cb6e7c433dac
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/bazel-diff" \
            "https://github.com/Tinder/bazel-diff/releases/download/${VERSION}/bazel-diff-rust-linux-amd64"
          echo "${SHA256}  ${RUNNER_TEMP}/bazel-diff" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/bazel-diff"

      # From a copy outside the tree: the script checks the base and the head
      # out in turn, which would otherwise swap the script file mid-run.
      - name: bazel/ci-impacted-targets.sh
        id: impacted
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
          BAZEL_DIFF: ${{ runner.temp }}/bazel-diff
          OUT_DIR: ${{ runner.temp }}/bazel-diff-out
        run: |
          cp bazel/ci-impacted-targets.sh "${RUNNER_TEMP}/ci-impacted-targets.sh"
          bash "${RUNNER_TEMP}/ci-impacted-targets.sh"

      - name: upload the impacted target lists
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: impacted-targets
          path: ${{ runner.temp }}/bazel-diff-out/impacted_*.txt
          if-no-files-found: error

  # Builds every impacted target and runs the impacted tests. Skipped when
  # nothing is impacted; the aggregate below accepts that only when `diff`
  # said so.
  build:
    name: build
    needs: [diff]
    if: needs.diff.outputs.has_any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      - name: download the impacted target lists
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: impacted-targets
          path: ${{ runner.temp }}/impacted

      # A list that is not there is not an empty list, a list of another
      # commit's tree is not a list of this one, and a flag `diff` set has to
      # agree with its list: the gate below trusts the flags.
      - name: the lists are for this checkout and agree with diff
        env:
          LISTS: ${{ runner.temp }}/impacted
          HAS_ANY: ${{ needs.diff.outputs.has_any }}
          HAS_TEST: ${{ needs.diff.outputs.has_test }}
        run: |
          for f in impacted_build.txt impacted_test.txt impacted_commit.txt; do
            [ -r "${LISTS}/${f}" ] || { echo "::error::${f} is missing from the impacted-targets artifact" >&2; exit 1; }
          done
          if [ "$(cat "${LISTS}/impacted_commit.txt")" != "$(git rev-parse HEAD)" ]; then
            echo "::error::the lists are for $(cat "${LISTS}/impacted_commit.txt"); this job checked out $(git rev-parse HEAD)" >&2
            exit 1
          fi
          [ "${HAS_ANY}" = true ] && [ -s "${LISTS}/impacted_build.txt" ] || { echo "::error::has_any is '${HAS_ANY}' and impacted_build.txt has $(wc -l <"${LISTS}/impacted_build.txt") target(s)" >&2; exit 1; }
          case "${HAS_TEST}" in
            true) [ -s "${LISTS}/impacted_test.txt" ] ;;
            false) [ ! -s "${LISTS}/impacted_test.txt" ] ;;
            *) false ;;
          esac || { echo "::error::has_test is '${HAS_TEST}' and impacted_test.txt has $(wc -l <"${LISTS}/impacted_test.txt") target(s)" >&2; exit 1; }
          echo "build: $(wc -l <"${LISTS}/impacted_build.txt") target(s); test: $(wc -l <"${LISTS}/impacted_test.txt")"

      # --config=ci refuses lockfile drift, and runs shellcheck on every
      # script as part of the build (bazel/lint/linters.bzl). The Go analyzers
      # of //:nogo run as part of compiling, so a finding fails here.
      - name: bazel build the impacted targets
        run: bazel build --config=ci --target_pattern_file="${RUNNER_TEMP}/impacted/impacted_build.txt"

      - name: bazel test the impacted tests
        if: needs.diff.outputs.has_test == 'true'
        run: bazel test --config=ci --target_pattern_file="${RUNNER_TEMP}/impacted/impacted_test.txt"

  # The run-queue eBPF program, loaded into the runner's kernel. `bazel test`
  # cannot do it (a test is not root), and the verifier and CO-RE relocations
  # are the part of the program the unit tests cannot check: this runs the
  # test binary under sudo (GitHub's runners have it, without a password).
  # TestKernelBTF, in `build`, already fails without root if the runner's BTF
  # lacks a field the program reads; this is the load itself. Always run, not
  # scoped by `diff`: the kernel is part of the input.
  bpf-load:
    name: bpf-load
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-bpf-load
          repository-cache: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      - name: build the run-queue test
        run: bazel build --config=ci //cgroup-signals/internal/runqlat:runqlat_test

      # -test.run: TestLoad (a failure to load, or no delay counted for a
      # process that waited for a CPU, fails the job) and TestCacheInvalidation
      # (what the program remembers per task is dropped when it stops being
      # true). A skip is a failure too: the point is that they ran.
      - name: load and attach the program as root
        run: |
          uname -r
          test_bin="$(bazel info --config=ci bazel-bin)/cgroup-signals/internal/runqlat/runqlat_test_/runqlat_test"
          out="$(sudo "${test_bin}" -test.v -test.run '^(TestLoad|TestCacheInvalidation|TestHighTids)$' 2>&1)" || { echo "${out}"; exit 1; }
          echo "${out}"
          for t in TestLoad TestCacheInvalidation TestHighTids; do
            grep -q -- "--- PASS: ${t}" <<<"${out}" || { echo "::error::${t} did not run and pass" >&2; exit 1; }
          done

      # What the programs cost, on the runner's kernel: the object this change
      # builds against the one the base commit builds, under the same
      # scheduler load (TestMeasure), alternating, three rounds each. The
      # numbers are the kernel's own run_cnt and run_time_ns (so they include
      # its clock reads) and are of this runner, not of any other machine: the
      # ratio is what carries over. Informational: it never fails the job.
      - name: checkout the base commit
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: measure the programs, base and head
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          # Copy each object out right after it is built: setup-bazel shares
          # one output base between the two workspaces, so the second build
          # replaces what bazel-bin holds.
          (cd base && bazel build --config=ci //bpf:runqlat \
            && cp "$(bazel info --config=ci bazel-bin)/bpf/runqlat.bpf.o" "${RUNNER_TEMP}/base.bpf.o")
          bazel build --config=ci //bpf:runqlat
          cp "$(bazel info --config=ci bazel-bin)/bpf/runqlat.bpf.o" "${RUNNER_TEMP}/head.bpf.o"
          cmp -s "${RUNNER_TEMP}/base.bpf.o" "${RUNNER_TEMP}/head.bpf.o" && echo "::warning::base and head objects are identical"
          base_obj="${RUNNER_TEMP}/base.bpf.o"
          head_obj="${RUNNER_TEMP}/head.bpf.o"
          test_bin="$(bazel info --config=ci bazel-bin)/cgroup-signals/internal/runqlat/runqlat_test_/runqlat_test"
          : >bench.txt
          for round in 1 2 3; do
            for which in base head; do
              obj="${base_obj}"; [ "${which}" = head ] && obj="${head_obj}"
              out="$(sudo env RUNQLAT_BENCH_OBJECT="${obj}" RUNQLAT_BENCH_SECONDS=10 \
                "${test_bin}" -test.run '^TestMeasure$' -test.v 2>&1)" || { echo "${out}"; exit 1; }
              echo "${out}" | grep -v '^BENCH ' || true
              grep '^BENCH ' <<<"${out}" | sed "/object=noop/! s|object=[^ ]*|object=${which}|" | tee -a bench.txt
            done
          done
          python3 - "$(uname -r)" "$(nproc)" <<'PY' | tee -a "${GITHUB_STEP_SUMMARY}"
          import statistics, sys
          rows = {}
          for line in open("bench.txt"):
              kv = dict(f.split("=", 1) for f in line.split()[1:])
              rows.setdefault((kv["prog"], kv["object"]), []).append(kv)
          print(f"### run-queue programs, base vs head ({sys.argv[1]}, {sys.argv[2]} CPUs)\n")
          print("| program | object | median ns/run | median runs/s | verified insns | xlated insns |")
          print("| --- | --- | --- | --- | --- | --- |")
          for prog in ("noop_sched_wakeup", "noop_sched_switch"):
              r = rows.get((prog, "noop"))
              if r:
                  ns = statistics.median(float(x["ns_per_run"]) for x in r)
                  print(f"| {prog} (the kernel's own overhead) | - | {ns:.1f} | - | - | - |")
          for prog in ("sched_wakeup", "sched_wakeup_new", "sched_switch"):
              for which in ("base", "head"):
                  r = rows.get((prog, which))
                  if not r:
                      continue
                  ns = statistics.median(float(x["ns_per_run"]) for x in r)
                  rs = statistics.median(float(x["runs_per_s"]) for x in r)
                  print(f"| {prog} | {which} | {ns:.1f} | {rs:.0f} | {r[0]['verified_insns']} | {r[0]['xlated_insns']} |")
          PY

  # The single check a ruleset should require. A required status check is
  # matched by check-run name, so requiring the jobs themselves ties the
  # ruleset to their names; requiring one aggregate leaves the jobs free to
  # change. if: always() so it runs even when a job fails; a skipped job
  # reports nothing, and a required check that never reports blocks the pull
  # request.
  #
  # A job bazel-diff scoped out is `skipped`, and that passes only where
  # `diff` said so, in so many words: `build` skipped with has_any `false`.
  # An output that was never set reads as the empty string, skips the job
  # exactly as `false` does, and is refused here. Everything else has to be
  # `success`.
  ci:
    name: ci
    needs: [lint, diff, build, bpf-load]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every job ended the way diff's outputs say it must
        env:
          LINT: ${{ needs.lint.result }}
          DIFF: ${{ needs.diff.result }}
          BUILD: ${{ needs.build.result }}
          BPF_LOAD: ${{ needs.bpf-load.result }}
          HAS_ANY: ${{ needs.diff.outputs.has_any }}
        run: |
          echo "lint=${LINT} diff=${DIFF} build=${BUILD} bpf-load=${BPF_LOAD} has_any='${HAS_ANY}'"
          ok=1
          [ "${LINT}" = success ] || { echo "::error::lint reported '${LINT}'" >&2; ok=0; }
          [ "${DIFF}" = success ] || { echo "::error::diff reported '${DIFF}'" >&2; ok=0; }
          [ "${BPF_LOAD}" = success ] || { echo "::error::bpf-load reported '${BPF_LOAD}'" >&2; ok=0; }
          case "${BUILD}:${HAS_ANY}" in
            success:true | skipped:false) ;;
            *) echo "::error::build reported '${BUILD}' with has_any '${HAS_ANY}'" >&2; ok=0 ;;
          esac
          [ "${ok}" = 1 ]
